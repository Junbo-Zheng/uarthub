[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "uarthub"
dynamic = ["version"]
description = "Share one serial port with multiple people over TCP — pure Python, zero config"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
authors = [
    { name = "Junbo Zheng", email = "3273070@qq.com" },
]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
]
dependencies = [
    "argcomplete>=3.1",
    "pyserial>=3.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov",
    "ruff",
    "build",
    "twine",
]

[project.urls]
Homepage = "https://github.com/Junbo-Zheng/uarthub"
Issues = "https://github.com/Junbo-Zheng/uarthub/issues"

[project.scripts]
uarthubd = "uarthub.cli:main"
uarthub = "uarthub.client:main"

[tool.hatch.version]
path = "src/uarthub/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/uarthub"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --strict-markers"
pythonpath = ["src"]
